name = "moontv-plus"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
minify = true

# 自定义域名配置（必须放在最顶层，不能放在 [vars] 下面）
routes = [
  { pattern = "tv.nshzswz.xyz", custom_domain = true }
]

# 静态资源配置
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "moontvplus"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# 环境变量（必须放在文件的最后面，或者放在独立区间）
[vars]
NODE_ENV = "production"
BUILD_TARGET = "cloudflare"
